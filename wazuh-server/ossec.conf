<!-- 
  NOTE: This is a snippet of the modified ossec.conf file. 
  The default Wazuh configurations have been omitted for security and readability.
  Below is the custom ChatOps integration engineered for this project.
-->

<ossec_config>
  <!-- ========================================== -->
  <!-- CHATOPS DISCORD WEBHOOK INTEGRATION        -->
  <!-- ========================================== -->
  <integration>
    <name>custom-discord</name>
    <hook_url>https://discord.com/api/webhooks/YOUR_DISCORD_WEBHOOK_TOKEN_HERE</hook_url>
    <level>10</level> <!-- Sends all high-priority alerts to Discord -->
    <alert_format>json</alert_format>
  </integration>
</ossec_config>
